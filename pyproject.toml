[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wechat-ai-companion"
version = "3.0.0"
description = "微信 AI 陪聊机器人 + 本地控制面板（零第三方依赖的面板层）"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "wechat-ai-companion contributors" }]
# 面板层只用标准库；后端依赖按需安装，见 requirements.txt
dependencies = []

[project.optional-dependencies]
wechat419 = ["wechatauto-replica"]
wechat40 = ["wxauto4"]
dev = ["pytest>=7.0", "pyinstaller>=6.0"]

[project.scripts]
wechat-panel = "ui_server:main"

[tool.setuptools]
packages = ["core", "web"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
# 项目在 Windows 上跑，日志里有中文，统一 UTF-8 输出
addopts = "-q"
